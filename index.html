<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2P Chat — Encrypted</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a26;
    --border: #2a2a40;
    --accent: #7c6aff;
    --green: #3dffb0;
    --text: #e8e8f0;
    --muted: #666680;
    --mono: 'Space Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 1000; opacity: 0.5;
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: var(--surface); flex-shrink: 0;
  }

  .logo {
    font-family: var(--sans); font-weight: 800; font-size: 18px;
    letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px;
  }
  .logo-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 10px var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  .status-pill {
    display: flex; align-items: center; gap: 6px; padding: 4px 12px;
    border-radius: 999px; border: 1px solid var(--border);
    font-size: 11px; color: var(--muted); transition: all .3s;
  }
  .status-pill.connected { border-color: var(--green); color: var(--green); }
  .status-dot { width:6px;height:6px;border-radius:50%;background:var(--muted);transition:all .3s; }
  .status-pill.connected .status-dot { background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 1.5s infinite; }

  .enc-badge {
    font-size: 10px; color: var(--green); display: flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 999px; border: 1px solid #3dffb033; background: #3dffb00a;
  }

  .app { display:flex; flex:1; overflow:hidden; }

  /* sidebar */
  .sidebar {
    width: 340px; border-right: 1px solid var(--border);
    background: var(--surface); display: flex; flex-direction: column;
    overflow: hidden; transition: width .3s; flex-shrink: 0;
  }
  .sidebar.hidden { width:0; border:none; }
  .sidebar-inner {
    padding: 16px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 14px;
    flex: 1; min-width: 340px;
  }

  .section-label {
    font-size: 10px; font-weight: 700; letter-spacing: 2px;
    color: var(--muted); text-transform: uppercase; margin-bottom: 6px;
  }

  .btn {
    padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); font-family: var(--mono);
    font-size: 11px; cursor: pointer; transition: all .15s;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:active { transform: scale(.98); }
  .btn-primary { background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700; }
  .btn-primary:hover { background:#9381ff;border-color:#9381ff;color:#fff; }
  .btn-green { border-color:var(--green);color:var(--green); }
  .btn-green:hover { background:var(--green);color:#000; }
  .btn-qr { border-color:#ff9f3d;color:#ff9f3d; }
  .btn-qr:hover { background:#ff9f3d;color:#000; }
  .btn-scan { border-color:#3dc8ff;color:#3dc8ff; }
  .btn-scan:hover { background:#3dc8ff;color:#000; }
  .btn-row { display:flex;gap:6px;margin-top:8px; }
  .btn-row .btn { flex:1; }

  textarea.sdp {
    width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-family:var(--mono); font-size:10px; padding:10px;
    resize:vertical; min-height:80px; outline:none; transition:border .2s; line-height:1.5;
  }
  textarea.sdp:focus { border-color:var(--accent); }

  .step { background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px; }
  .step-title {
    font-family:var(--sans);font-weight:700;font-size:13px;margin-bottom:10px;
    display:flex;align-items:center;gap:8px;
  }
  .step-num {
    width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;
    font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;
  }

  /* chat */
  .chat-area { flex:1;display:flex;flex-direction:column;overflow:hidden; }
  .messages { flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px; }
  .messages::-webkit-scrollbar { width:4px; }
  .messages::-webkit-scrollbar-thumb { background:var(--border);border-radius:2px; }

  .msg { max-width:72%;display:flex;flex-direction:column;gap:3px;animation:fadeUp .2s ease; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
  .msg.me { align-self:flex-end;align-items:flex-end; }
  .msg.them { align-self:flex-start;align-items:flex-start; }
  .msg-bubble { padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.6;word-break:break-word; }
  .msg.me .msg-bubble { background:var(--accent);color:#fff;border-bottom-right-radius:3px; }
  .msg.them .msg-bubble { background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:3px; }
  .msg-meta { font-size:10px;color:var(--muted); }

  .msg-img { max-width:260px;max-height:200px;border-radius:10px;cursor:pointer;transition:opacity .2s;display:block; }
  .msg-img:hover { opacity:.85; }
  .msg-file {
    display:flex;align-items:center;gap:10px;padding:10px 14px;
    background:var(--surface2);border:1px solid var(--border);border-radius:10px;font-size:12px;
  }
  .msg-file .file-icon { font-size:22px; }
  .msg-file a { color:var(--accent);text-decoration:none;word-break:break-all; }
  .msg-file a:hover { text-decoration:underline; }
  .msg-system {
    align-self:center;font-size:11px;color:var(--muted);
    background:var(--surface);border:1px solid var(--border);
    border-radius:999px;padding:3px 12px;animation:fadeUp .2s ease;
  }

  .input-bar {
    border-top:1px solid var(--border);padding:12px 16px;
    display:flex;align-items:center;gap:8px;background:var(--surface);flex-shrink:0;
  }
  .file-btn {
    background:none;border:1px solid var(--border);border-radius:6px;
    color:var(--muted);cursor:pointer;padding:7px 10px;font-size:16px;transition:all .15s;line-height:1;
  }
  .file-btn:hover { border-color:var(--accent);color:var(--accent); }
  .msg-input {
    flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-family:var(--mono);font-size:13px;padding:9px 14px;
    outline:none;transition:border .2s;resize:none;height:40px;max-height:120px;overflow-y:auto;
  }
  .msg-input:focus { border-color:var(--accent); }
  .msg-input::placeholder { color:var(--muted); }
  .send-btn {
    background:var(--accent);border:none;border-radius:8px;color:#fff;
    cursor:pointer;padding:9px 16px;font-size:16px;transition:all .15s;
  }
  .send-btn:hover { background:#9381ff; }
  .send-btn:active { transform:scale(.95); }
  .send-btn:disabled { opacity:.4;cursor:not-allowed; }
  .toggle-sb {
    background:none;border:1px solid var(--border);border-radius:6px;
    color:var(--muted);cursor:pointer;padding:7px 10px;font-size:14px;transition:all .15s;line-height:1;
  }
  .toggle-sb:hover { border-color:var(--accent);color:var(--accent); }

  /* lightbox */
  .lightbox {
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);
    z-index:2000;align-items:center;justify-content:center;cursor:zoom-out;backdrop-filter:blur(6px);
  }
  .lightbox.open { display:flex; }
  .lightbox img { max-width:90vw;max-height:90vh;border-radius:8px; }

  /* modal */
  .modal-overlay {
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);
    backdrop-filter:blur(10px);z-index:3000;
    align-items:center;justify-content:center;padding:20px;
  }
  .modal-overlay.open { display:flex; }
  .modal-box {
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:24px;display:flex;flex-direction:column;gap:16px;
    max-width:400px;width:100%;animation:modalIn .2s ease;
  }
  @keyframes modalIn { from{opacity:0;transform:scale(.93)} to{opacity:1;transform:none} }
  .modal-header { display:flex;align-items:center;justify-content:space-between; }
  .modal-title { font-family:var(--sans);font-weight:800;font-size:15px; }
  .modal-close {
    background:none;border:1px solid var(--border);border-radius:6px;
    color:var(--muted);cursor:pointer;padding:4px 9px;font-size:12px;transition:all .15s;
  }
  .modal-close:hover { border-color:var(--accent);color:var(--accent); }
  .modal-hint { font-size:11px;color:var(--muted);text-align:center;line-height:1.6; }

  /* QR */
  #qrContainer {
    display:flex;justify-content:center;align-items:center;
    background:#fff;border-radius:12px;padding:18px;min-height:248px;
  }
  .qr-meta {
    font-size:10px;color:var(--muted);text-align:center;
    background:var(--surface2);border:1px solid var(--border);
    border-radius:6px;padding:6px 10px;line-height:1.6;
  }

  /* scanner */
  .scanner-wrap {
    position:relative;border-radius:12px;overflow:hidden;
    background:#000;aspect-ratio:1;max-height:300px;
  }
  #scanVideo { width:100%;height:100%;object-fit:cover;display:block; }
  #scanCanvas { display:none; }

  .scan-corner {
    position:absolute;width:30px;height:30px;
    border-color:var(--accent);border-style:solid;border-width:0;
  }
  .scan-corner.tl { top:10px;left:10px;border-top-width:3px;border-left-width:3px;border-top-left-radius:4px; }
  .scan-corner.tr { top:10px;right:10px;border-top-width:3px;border-right-width:3px;border-top-right-radius:4px; }
  .scan-corner.bl { bottom:10px;left:10px;border-bottom-width:3px;border-left-width:3px;border-bottom-left-radius:4px; }
  .scan-corner.br { bottom:10px;right:10px;border-bottom-width:3px;border-right-width:3px;border-bottom-right-radius:4px; }

  .scan-line {
    position:absolute;left:10px;right:10px;height:2px;top:10px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
    animation:scanMove 2s ease-in-out infinite;
    box-shadow:0 0 8px var(--accent);
  }
  @keyframes scanMove { 0%{top:10px} 50%{top:calc(100% - 12px)} 100%{top:10px} }

  .scan-status {
    font-size:11px;color:var(--muted);text-align:center;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .scan-status .blink { width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite; }

  .scan-success-overlay {
    position:absolute;inset:0;background:rgba(61,255,176,.18);
    display:flex;align-items:center;justify-content:center;
    font-size:54px;border-radius:12px;
    animation:scanSuccess .35s ease;
  }
  @keyframes scanSuccess { from{opacity:0;transform:scale(.8)} to{opacity:1;transform:none} }

  ::-webkit-scrollbar { width:4px;height:4px; }
  ::-webkit-scrollbar-thumb { background:var(--border);border-radius:2px; }

  @media (max-width:640px) {
    .sidebar { position:absolute;z-index:100;height:100%; }
    .sidebar.hidden { display:none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span class="logo-dot"></span>P2P / Encrypted Chat</div>
  <div style="display:flex;align-items:center;gap:8px;">
    <div class="enc-badge">🔒 E2E AES-GCM</div>
    <div class="status-pill" id="statusPill">
      <span class="status-dot"></span>
      <span id="statusText">disconnected</span>
    </div>
  </div>
</header>

<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-inner">

      <div>
        <div class="section-label">接続ロール</div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-primary" id="btnOffer" onclick="startOffer()">📡 発信者</button>
          <button class="btn" id="btnAnswer" onclick="showAnswerUI()">📥 受信者</button>
        </div>
      </div>

      <!-- ── Offer flow ── -->
      <div id="offerSection" style="display:none;flex-direction:column;gap:10px;">
        <div class="step">
          <div class="step-title"><span class="step-num">1</span>Offer を相手に渡す</div>
          <textarea class="sdp" id="offerSDP" readonly placeholder="生成中..."></textarea>
          <div class="btn-row">
            <button class="btn" onclick="copyText('offerSDP')">📋 コピー</button>
            <button class="btn btn-qr" onclick="showQR('offerSDP','Offer QR')">▦ QR表示</button>
          </div>
        </div>
        <div class="step">
          <div class="step-title"><span class="step-num">2</span>相手の Answer を入力</div>
          <textarea class="sdp" id="answerInput" placeholder="貼り付け or スキャン..."></textarea>
          <div class="btn-row">
            <button class="btn btn-scan" onclick="openScanner('answerInput')">📷 QRスキャン</button>
            <button class="btn btn-green" onclick="applyAnswer()">✅ 接続</button>
          </div>
        </div>
      </div>

      <!-- ── Answer flow ── -->
      <div id="answerSection" style="display:none;flex-direction:column;gap:10px;">
        <div class="step">
          <div class="step-title"><span class="step-num">1</span>相手の Offer を入力</div>
          <textarea class="sdp" id="offerInput" placeholder="貼り付け or スキャン..."></textarea>
          <div class="btn-row">
            <button class="btn btn-scan" onclick="openScanner('offerInput')">📷 QRスキャン</button>
            <button class="btn btn-primary" onclick="processOffer()">⚡ Answer 生成</button>
          </div>
        </div>
        <div class="step" id="answerOutputStep" style="display:none;">
          <div class="step-title"><span class="step-num">2</span>Answer を相手に渡す</div>
          <textarea class="sdp" id="answerSDP" readonly placeholder="生成中..."></textarea>
          <div class="btn-row">
            <button class="btn" onclick="copyText('answerSDP')">📋 コピー</button>
            <button class="btn btn-qr" onclick="showQR('answerSDP','Answer QR')">▦ QR表示</button>
          </div>
        </div>
      </div>

      <div style="font-size:10px;color:var(--muted);line-height:1.7;border-top:1px solid var(--border);padding-top:12px;">
        🔒 AES-GCM 256bit 暗号化<br>
        📡 接続後はサーバー不要<br>
        ▦ QRでシグナリング交換可能
      </div>
    </div>
  </div>

  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="msg-system">接続を確立してチャットを開始してください</div>
    </div>
    <div class="input-bar">
      <button class="toggle-sb" onclick="toggleSidebar()">☰</button>
      <input type="file" id="fileInput" style="display:none" onchange="sendFile(this)">
      <button class="file-btn" onclick="document.getElementById('fileInput').click()">📎</button>
      <textarea class="msg-input" id="msgInput" placeholder="メッセージ入力... (Enter送信)" rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>↑</button>
    </div>
  </div>
</div>

<!-- lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt="">
</div>

<!-- ── QR modal ── -->
<div class="modal-overlay" id="qrModal">
  <div class="modal-box" style="max-width:360px;">
    <div class="modal-header">
      <span class="modal-title" id="qrModalTitle">QR Code</span>
      <button class="modal-close" onclick="closeQRModal()">✕ 閉じる</button>
    </div>
    <div id="qrContainer"><span style="color:#666;font-size:12px;">生成中...</span></div>
    <div class="qr-meta" id="qrMeta"></div>
    <p class="modal-hint">相手のデバイスでこのQRを読み取ってください<br>
      <span style="color:#ff9f3d;">📷 QRスキャン</span> ボタンで読み込めます</p>
  </div>
</div>

<!-- ── Scanner modal ── -->
<div class="modal-overlay" id="scanModal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">📷 QRスキャン</span>
      <button class="modal-close" onclick="closeScanner()">✕ キャンセル</button>
    </div>
    <div class="scanner-wrap" id="scannerWrap">
      <video id="scanVideo" autoplay playsinline muted></video>
      <canvas id="scanCanvas"></canvas>
      <div class="scan-corner tl"></div>
      <div class="scan-corner tr"></div>
      <div class="scan-corner bl"></div>
      <div class="scan-corner br"></div>
      <div class="scan-line" id="scanLine"></div>
    </div>
    <div class="scan-status">
      <span class="blink"></span>
      <span id="scanStatusText">カメラにQRをかざしてください</span>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
let pc=null, dc=null, cryptoKey=null;
let sidebarVisible=true;
let scanTarget=null, scanStream=null, scanRAF=null;
const CHUNK_SIZE=16*1024;
let incomingFiles={};

// ─────────────────────────────────────────────
//  Compression (deflate-raw)
// ─────────────────────────────────────────────
async function compress(str) {
  const cs=new CompressionStream('deflate-raw');
  const w=cs.writable.getWriter();
  w.write(new TextEncoder().encode(str)); w.close();
  const chunks=[]; const r=cs.readable.getReader();
  while(true){const{done,value}=await r.read();if(done)break;chunks.push(value);}
  const total=chunks.reduce((a,c)=>a+c.length,0);
  const out=new Uint8Array(total);let off=0;
  for(const c of chunks){out.set(c,off);off+=c.length;}
  return btoa(String.fromCharCode(...out)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}

async function decompress(b64url) {
  const b64=b64url.replace(/-/g,'+').replace(/_/g,'/');
  const padded=b64+'='.repeat((4-b64.length%4)%4);
  const bytes=Uint8Array.from(atob(padded),c=>c.charCodeAt(0));
  const ds=new DecompressionStream('deflate-raw');
  const w=ds.writable.getWriter();w.write(bytes);w.close();
  const chunks=[];const r=ds.readable.getReader();
  while(true){const{done,value}=await r.read();if(done)break;chunks.push(value);}
  const total=chunks.reduce((a,c)=>a+c.length,0);
  const out=new Uint8Array(total);let off=0;
  for(const c of chunks){out.set(c,off);off+=c.length;}
  return new TextDecoder().decode(out);
}

// ─────────────────────────────────────────────
//  Crypto – ECDH key exchange + AES-GCM
// ─────────────────────────────────────────────
let ecdhKeyPair=null,ecdhPubB64=null;

async function initECDH(){
  ecdhKeyPair=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
  const raw=await crypto.subtle.exportKey('raw',ecdhKeyPair.publicKey);
  ecdhPubB64=btoa(String.fromCharCode(...new Uint8Array(raw)));
}

async function deriveSharedKey(theirPubB64){
  const raw=Uint8Array.from(atob(theirPubB64),c=>c.charCodeAt(0));
  const theirPub=await crypto.subtle.importKey('raw',raw,{name:'ECDH',namedCurve:'P-256'},false,[]);
  cryptoKey=await crypto.subtle.deriveKey(
    {name:'ECDH',public:theirPub},ecdhKeyPair.privateKey,
    {name:'AES-GCM',length:256},false,['encrypt','decrypt']
  );
}

async function encrypt(str){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},cryptoKey,new TextEncoder().encode(str));
  const buf=new Uint8Array(12+ct.byteLength);buf.set(iv);buf.set(new Uint8Array(ct),12);
  return btoa(String.fromCharCode(...buf));
}

async function decrypt(b64){
  const buf=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},cryptoKey,buf.slice(12));
  return new TextDecoder().decode(pt);
}

async function encryptBinary(ab){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},cryptoKey,ab);
  const out=new Uint8Array(12+ct.byteLength);out.set(iv);out.set(new Uint8Array(ct),12);
  return out.buffer;
}

async function decryptBinary(ab){
  const buf=new Uint8Array(ab);
  return crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},cryptoKey,buf.slice(12));
}

// ─────────────────────────────────────────────
//  WebRTC
// ─────────────────────────────────────────────
const ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}];

function createPC(){
  pc=new RTCPeerConnection({iceServers:ICE});
  pc.onconnectionstatechange=()=>{
    updateStatus(pc.connectionState);
    if(pc.connectionState==='connected'){
      document.getElementById('sendBtn').disabled=false;
      addSystem('🔒 P2P接続確立 — 暗号化チャット開始');
    } else if(['disconnected','failed','closed'].includes(pc.connectionState)){
      document.getElementById('sendBtn').disabled=true;
    }
  };
  pc.ondatachannel=e=>setupDC(e.channel);
}

function setupDC(channel){
  dc=channel;dc.binaryType='arraybuffer';
  dc.onmessage=async e=>{
    if(typeof e.data==='string'){try{await handleMessage(JSON.parse(e.data));}catch{}}
    else{await handleBinaryChunk(e.data);}
  };
}

async function handleMessage(msg){
  if(msg.type==='text'){addMessage(await decrypt(msg.payload),'them');}
  else if(msg.type==='file-meta'){incomingFiles[msg.id]={name:msg.name,mime:msg.mime,total:msg.total,chunks:[]};}
  else if(msg.type==='file-done'){
    const f=incomingFiles[msg.id];if(!f)return;
    addFileMessage(f.name,f.mime,URL.createObjectURL(new Blob(f.chunks,{type:f.mime})),'them');
    delete incomingFiles[msg.id];
  }
}

async function handleBinaryChunk(buf){
  const view=new DataView(buf);
  let fileId='';for(let i=0;i<8;i++)fileId+=view.getUint8(i).toString(16).padStart(2,'0');
  const plain=await decryptBinary(buf.slice(8));
  const f=incomingFiles[fileId];if(!f)return;
  f.chunks.push(plain);
}

// ─────────────────────────────────────────────
//  Offer / Answer
// ─────────────────────────────────────────────
async function startOffer(){
  await initECDH();createPC();
  dc=pc.createDataChannel('chat');dc.binaryType='arraybuffer';setupDC(dc);
  await pc.setLocalDescription(await pc.createOffer());
  await waitICE(pc);
  const obj={sdp:pc.localDescription.sdp,type:pc.localDescription.type,pub:ecdhPubB64};
  document.getElementById('offerSDP').value=JSON.stringify(obj);
  document.getElementById('offerSection').style.display='flex';
  document.getElementById('btnOffer').disabled=true;  
  document.getElementById('btnAnswer').disabled=true;
}

async function showAnswerUI(){
  await initECDH();
  document.getElementById('answerSection').style.display='flex';
  document.getElementById('btnOffer').disabled=true;
  document.getElementById('btnAnswer').disabled=true;
}

async function processOffer(){
  const raw=document.getElementById('offerInput').value.trim();
  if(!raw)return alert('Offer を入力してください');
  let obj;try{obj=JSON.parse(raw);}catch{return alert('無効な Offer です');}
  await deriveSharedKey(obj.pub);createPC();
  await pc.setRemoteDescription({type:obj.type,sdp:obj.sdp});
  await pc.setLocalDescription(await pc.createAnswer());
  await waitICE(pc);
  const answerObj={sdp:pc.localDescription.sdp,type:pc.localDescription.type,pub:ecdhPubB64};
  document.getElementById('answerSDP').value=JSON.stringify(answerObj);
  document.getElementById('answerOutputStep').style.display='block';
}

async function applyAnswer(){
  const raw=document.getElementById('answerInput').value.trim();
  if(!raw)return alert('Answer を入力してください');
  let obj;try{obj=JSON.parse(raw);}catch{return alert('無効な Answer です');}
  await deriveSharedKey(obj.pub);
  await pc.setRemoteDescription({type:obj.type,sdp:obj.sdp});
}

function waitICE(pc){
  return new Promise(resolve=>{
    if(pc.iceGatheringState==='complete')return resolve();
    pc.onicegatheringstatechange=()=>{if(pc.iceGatheringState==='complete')resolve();};
    setTimeout(resolve,5000);
  });
}

// ─────────────────────────────────────────────
//  QR Display
// ─────────────────────────────────────────────
async function showQR(textareaId, title){
  const raw=document.getElementById(textareaId).value.trim();
  if(!raw)return alert('まず生成してください');

  document.getElementById('qrModalTitle').textContent=title;
  document.getElementById('qrMeta').textContent='圧縮中...';
  const container=document.getElementById('qrContainer');
  container.innerHTML='<span style="color:#666;font-size:12px;">生成中...</span>';
  document.getElementById('qrModal').classList.add('open');

  try{
    const compressed=await compress(raw);
    const qrData='P2PC:'+compressed;

    // estimate byte size
    const byteEst=Math.ceil(compressed.length*6/8);
    document.getElementById('qrMeta').textContent=
      `元サイズ: ${raw.length} B → 圧縮後: ≈${byteEst} B / QR上限: 2953 B`;

    if(byteEst>2900){
      container.innerHTML='<p style="color:#ff6a6a;font-size:11px;text-align:center;padding:16px;line-height:1.8;">データが大きすぎてQRに収まりません。<br>📋 コピー を使用してください。</p>';
      return;
    }

    container.innerHTML='';
    new QRCode(container,{
      text: qrData,
      width: 340,
      height: 340,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.L
    });
  }catch(e){
    container.innerHTML='<p style="color:#ff6a6a;font-size:11px;padding:16px;">QR生成に失敗しました</p>';
    console.error(e);
  }
}

function closeQRModal(){
  document.getElementById('qrModal').classList.remove('open');
  document.getElementById('qrContainer').innerHTML='';
}

// ─────────────────────────────────────────────
//  QR Scanner
// ─────────────────────────────────────────────
async function openScanner(targetId){
  scanTarget=targetId;
  // reset UI
  const wrap=document.getElementById('scannerWrap');
  wrap.querySelector('.scan-success-overlay')?.remove();
  document.getElementById('scanStatusText').textContent='カメラにQRをかざしてください';
  document.getElementById('scanLine').style.display='block';
  document.getElementById('scanModal').classList.add('open');

  try{
    scanStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}
    });
    const video=document.getElementById('scanVideo');
    video.srcObject=scanStream;
    await video.play();
    scanRAF=requestAnimationFrame(scanFrame);
  }catch(e){
    document.getElementById('scanStatusText').textContent='❌ カメラへのアクセスが拒否されました';
  }
}

function scanFrame(ts){
  const video=document.getElementById('scanVideo');
  const canvas=document.getElementById('scanCanvas');

  if(video.readyState!==video.HAVE_ENOUGH_DATA){
    scanRAF=requestAnimationFrame(scanFrame);
    return;
  }

  if(!scanFrame.last) scanFrame.last = 0;
  if(ts - scanFrame.last < 120){
    scanRAF=requestAnimationFrame(scanFrame);
    return;
  }
  scanFrame.last = ts;

  const ctx=canvas.getContext('2d');

  const targetWidth = 640;
  const scale = targetWidth / video.videoWidth;

  canvas.width = targetWidth;
  canvas.height = video.videoHeight * scale;

  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  const imageData=ctx.getImageData(0,0,canvas.width,canvas.height);

  const code=jsQR(
    imageData.data,
    imageData.width,
    imageData.height,
    { inversionAttempts:'attemptBoth' }
  );

  if(code && code.data){
    handleScanResult(code.data);
  }else{
    scanRAF=requestAnimationFrame(scanFrame);
  }
}

async function handleScanResult(data){
  cancelAnimationFrame(scanRAF);scanRAF=null;
  document.getElementById('scanLine').style.display='none';

  // success overlay
  const wrap=document.getElementById('scannerWrap');
  const overlay=document.createElement('div');
  overlay.className='scan-success-overlay';
  overlay.textContent='✅';
  wrap.appendChild(overlay);
  document.getElementById('scanStatusText').textContent='QRを読み取りました！';

  try{
    let json;
    if(data.startsWith('P2PC:')){
      json=await decompress(data.slice(5));
    }else{
      json=data; // fallback: raw JSON
    }
    JSON.parse(json); // validate

    document.getElementById(scanTarget).value=json;
    setTimeout(()=>closeScanner(),700);
  }catch(e){
    overlay.textContent='❌';
    document.getElementById('scanStatusText').textContent='無効なQRコードです。もう一度試してください';
    setTimeout(()=>{
      overlay.remove();
      document.getElementById('scanLine').style.display='block';
      document.getElementById('scanStatusText').textContent='カメラにQRをかざしてください';
      scanRAF=requestAnimationFrame(scanFrame);
    },1800);
  }
}

function closeScanner(){
  document.getElementById('scanModal').classList.remove('open');
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}
  if(scanRAF){cancelAnimationFrame(scanRAF);scanRAF=null;}
  document.getElementById('scanVideo').srcObject=null;
}

// ─────────────────────────────────────────────
//  Messaging
// ─────────────────────────────────────────────
async function sendMessage(){
  const input=document.getElementById('msgInput');
  const text=input.value.trim();
  if(!text||!dc||dc.readyState!=='open')return;
  dc.send(JSON.stringify({type:'text',payload:await encrypt(text)}));
  addMessage(text,'me');
  input.value='';input.style.height='40px';
}

// ─────────────────────────────────────────────
//  File sending
// ─────────────────────────────────────────────
async function sendFile(input){
  const file=input.files[0];if(!file||!dc||dc.readyState!=='open')return;input.value='';
  const idBytes=crypto.getRandomValues(new Uint8Array(8));
  const fileId=Array.from(idBytes).map(b=>b.toString(16).padStart(2,'0')).join('');
  const totalChunks=Math.ceil(file.size/CHUNK_SIZE);
  dc.send(JSON.stringify({type:'file-meta',id:fileId,name:file.name,mime:file.type||'application/octet-stream',total:totalChunks}));
  const ab=await file.arrayBuffer();
  for(let i=0;i<totalChunks;i++){
    const enc=await encryptBinary(ab.slice(i*CHUNK_SIZE,(i+1)*CHUNK_SIZE));
    const out=new Uint8Array(8+enc.byteLength);out.set(idBytes);out.set(new Uint8Array(enc),8);
    while(dc.bufferedAmount>1024*1024)await new Promise(r=>setTimeout(r,50));
    dc.send(out.buffer);
  }
  dc.send(JSON.stringify({type:'file-done',id:fileId}));
  addFileMessage(file.name,file.type,URL.createObjectURL(file),'me');
}

// ─────────────────────────────────────────────
//  UI helpers
// ─────────────────────────────────────────────
function addMessage(text,who){
  const w=document.createElement('div');w.className=`msg ${who}`;
  const b=document.createElement('div');b.className='msg-bubble';b.textContent=text;
  const m=document.createElement('div');m.className='msg-meta';
  m.textContent=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  w.append(b,m);document.getElementById('messages').appendChild(w);scrollBottom();
}

function addFileMessage(name,mime,url,who){
  const w=document.createElement('div');w.className=`msg ${who}`;
  if(mime.startsWith('image/')){
    const img=document.createElement('img');img.className='msg-img';img.src=url;img.alt=name;
    img.onclick=()=>openLightbox(url);w.appendChild(img);
  }else{
    const fd=document.createElement('div');fd.className='msg-file';
    const ic=document.createElement('span');ic.className='file-icon';ic.textContent=getFileIcon(mime);
    const info=document.createElement('div');
    const a=document.createElement('a');a.href=url;a.download=name;a.textContent=name;
    info.appendChild(a);fd.append(ic,info);w.appendChild(fd);
  }
  const m=document.createElement('div');m.className='msg-meta';
  m.textContent=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  w.appendChild(m);document.getElementById('messages').appendChild(w);scrollBottom();
}

function addSystem(text){
  const el=document.createElement('div');el.className='msg-system';el.textContent=text;
  document.getElementById('messages').appendChild(el);scrollBottom();
}

function scrollBottom(){const m=document.getElementById('messages');m.scrollTop=m.scrollHeight;}

function updateStatus(state){
  document.getElementById('statusText').textContent=state;
  document.getElementById('statusPill').className=`status-pill ${state==='connected'?'connected':''}`;
}

function copyText(id){
  const el=document.getElementById(id);
  navigator.clipboard.writeText(el.value).then(()=>{
    el.parentElement.querySelectorAll('.btn').forEach(b=>{
      if(b.textContent.includes('コピー')){
        const orig=b.textContent;b.textContent='✅ コピー済み';
        setTimeout(()=>b.textContent=orig,2000);
      }
    });
  });
}

function toggleSidebar(){
  sidebarVisible=!sidebarVisible;
  document.getElementById('sidebar').classList.toggle('hidden',!sidebarVisible);
}

function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}
function autoResize(el){el.style.height='40px';el.style.height=Math.min(el.scrollHeight,120)+'px';}
function getFileIcon(mime){
  if(mime.startsWith('video/'))return'🎬';if(mime.startsWith('audio/'))return'🎵';
  if(mime.includes('pdf'))return'📄';if(mime.includes('zip')||mime.includes('rar'))return'🗜️';return'📁';
}
function openLightbox(url){document.getElementById('lightboxImg').src=url;document.getElementById('lightbox').classList.add('open');}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open');}

document.getElementById('qrModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeQRModal();});
document.getElementById('scanModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeScanner();});
</script>
