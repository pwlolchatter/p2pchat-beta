<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2P Chat — Encrypted</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a26;
    --border: #2a2a40;
    --accent: #7c6aff;
    --accent2: #ff6a9a;
    --green: #3dffb0;
    --text: #e8e8f0;
    --muted: #666680;
    --mono: 'Space Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ─── noise overlay ─── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.5;
  }

  /* ─── header ─── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .logo {
    font-family: var(--sans);
    font-weight: 800;
    font-size: 18px;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    font-family: var(--mono);
    transition: all .3s;
  }

  .status-pill.connected {
    border-color: var(--green);
    color: var(--green);
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
    transition: all .3s;
  }

  .status-pill.connected .status-dot {
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: pulse 1.5s infinite;
  }

  /* ─── layout ─── */
  .app {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ─── sidebar (signaling) ─── */
  .sidebar {
    width: 340px;
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width .3s;
    flex-shrink: 0;
  }

  .sidebar.hidden {
    width: 0;
    border: none;
  }

  .sidebar-inner {
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 1;
    min-width: 340px;
  }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .btn {
    padding: 9px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
  }

  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:active { transform: scale(.98); }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 700;
  }
  .btn-primary:hover { background: #9381ff; border-color: #9381ff; color: #fff; }

  .btn-green {
    background: transparent;
    border-color: var(--green);
    color: var(--green);
  }
  .btn-green:hover { background: var(--green); color: #000; }

  textarea.sdp {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 10px;
    padding: 10px;
    resize: vertical;
    min-height: 90px;
    outline: none;
    transition: border .2s;
    line-height: 1.5;
  }

  textarea.sdp:focus { border-color: var(--accent); }

  .step {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }

  .step-title {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .step-num {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    flex-shrink: 0;
  }

  /* ─── chat area ─── */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg {
    max-width: 72%;
    display: flex;
    flex-direction: column;
    gap: 3px;
    animation: fadeUp .2s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.me { align-self: flex-end; align-items: flex-end; }
  .msg.them { align-self: flex-start; align-items: flex-start; }

  .msg-bubble {
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.6;
    word-break: break-word;
  }

  .msg.me .msg-bubble {
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 3px;
  }

  .msg.them .msg-bubble {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
  }

  .msg-meta {
    font-size: 10px;
    color: var(--muted);
  }

  /* ─── image / file ─── */
  .msg-img {
    max-width: 260px;
    max-height: 200px;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity .2s;
    display: block;
  }

  .msg-img:hover { opacity: .85; }

  .msg-file {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 12px;
  }

  .msg-file .file-icon { font-size: 22px; }

  .msg-file a {
    color: var(--accent);
    text-decoration: none;
    word-break: break-all;
  }

  .msg-file a:hover { text-decoration: underline; }

  /* system message */
  .msg-system {
    align-self: center;
    font-size: 11px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 12px;
    animation: fadeUp .2s ease;
  }

  /* ─── input bar ─── */
  .input-bar {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    flex-shrink: 0;
  }

  .file-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
    padding: 7px 10px;
    font-size: 16px;
    transition: all .15s;
    line-height: 1;
  }

  .file-btn:hover { border-color: var(--accent); color: var(--accent); }

  .msg-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 9px 14px;
    outline: none;
    transition: border .2s;
    resize: none;
    height: 40px;
    max-height: 120px;
    overflow-y: auto;
  }

  .msg-input:focus { border-color: var(--accent); }
  .msg-input::placeholder { color: var(--muted); }

  .send-btn {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    padding: 9px 16px;
    font-size: 16px;
    transition: all .15s;
  }

  .send-btn:hover { background: #9381ff; }
  .send-btn:active { transform: scale(.95); }
  .send-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* ─── toggle sidebar btn ─── */
  .toggle-sb {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
    padding: 7px 10px;
    font-size: 14px;
    transition: all .15s;
    line-height: 1;
  }
  .toggle-sb:hover { border-color: var(--accent); color: var(--accent); }

  /* ─── lightbox ─── */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.85);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
    backdrop-filter: blur(6px);
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }

  /* ─── transfer progress ─── */
  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 6px;
    display: none;
  }
  .progress-bar.active { display: block; }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width .1s;
  }

  /* ─── encrypted badge ─── */
  .enc-badge {
    font-size: 10px;
    color: var(--green);
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid #3dffb033;
    background: #3dffb00a;
  }

  /* scrollbar global */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  @media (max-width: 640px) {
    .sidebar { position: absolute; z-index: 100; height: 100%; background: var(--surface); }
    .sidebar.hidden { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-dot"></span>
    P2P / Encrypted Chat
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <div class="enc-badge">🔒 E2E AES-GCM</div>
    <div class="status-pill" id="statusPill">
      <span class="status-dot"></span>
      <span id="statusText">disconnected</span>
    </div>
  </div>
</header>

<div class="app">
  <!-- sidebar: signaling -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-inner">

      <!-- Role -->
      <div>
        <div class="section-label">接続ロール</div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-primary" id="btnOffer" onclick="startOffer()">📡 発信者 (Offer)</button>
          <button class="btn" id="btnAnswer" onclick="showAnswerUI()">📥 受信者 (Answer)</button>
        </div>
      </div>

      <!-- Offer flow -->
      <div id="offerSection" style="display:none;flex-direction:column;gap:10px;">
        <div class="step">
          <div class="step-title"><span class="step-num">1</span>Offer を生成してコピー</div>
          <textarea class="sdp" id="offerSDP" readonly placeholder="Offer が生成されると表示されます..."></textarea>
          <div id="offerProgress" class="progress-bar"><div class="progress-fill" id="offerProgressFill"></div></div>
          <button class="btn" style="margin-top:8px;" onclick="copyText('offerSDP')">📋 コピー</button>
        </div>
        <div class="step">
          <div class="step-title"><span class="step-num">2</span>相手の Answer を貼り付け</div>
          <textarea class="sdp" id="answerInput" placeholder="相手の Answer をここに貼り付け..."></textarea>
          <button class="btn btn-green" style="margin-top:8px;" onclick="applyAnswer()">✅ 接続</button>
        </div>
      </div>

      <!-- Answer flow -->
      <div id="answerSection" style="display:none;flex-direction:column;gap:10px;">
        <div class="step">
          <div class="step-title"><span class="step-num">1</span>相手の Offer を貼り付け</div>
          <textarea class="sdp" id="offerInput" placeholder="相手の Offer をここに貼り付け..."></textarea>
          <button class="btn btn-primary" style="margin-top:8px;" onclick="processOffer()">⚡ Answer 生成</button>
        </div>
        <div class="step" id="answerOutputStep" style="display:none;">
          <div class="step-title"><span class="step-num">2</span>この Answer を相手に渡す</div>
          <textarea class="sdp" id="answerSDP" readonly placeholder="Answer が生成されると表示されます..."></textarea>
          <button class="btn" style="margin-top:8px;" onclick="copyText('answerSDP')">📋 コピー</button>
        </div>
      </div>

      <!-- Info -->
      <div style="font-size:10px;color:var(--muted);line-height:1.7;border-top:1px solid var(--border);padding-top:12px;">
        🔒 全メッセージは AES-GCM 256bit で暗号化<br>
        📡 接続後はサーバーを一切使いません<br>
        🗑️ ページを閉じるとデータは消えます
      </div>

    </div>
  </div>

  <!-- chat -->
  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="msg-system">接続を確立してチャットを開始してください</div>
    </div>

    <div class="input-bar">
      <button class="toggle-sb" onclick="toggleSidebar()" title="接続パネル">☰</button>
      <input type="file" id="fileInput" style="display:none" onchange="sendFile(this)">
      <button class="file-btn" onclick="document.getElementById('fileInput').click()" title="ファイル送信">📎</button>
      <textarea class="msg-input" id="msgInput" placeholder="メッセージを入力... (Enter で送信)" rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>↑</button>
    </div>
  </div>
</div>

<!-- lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt="">
</div>

<script>
// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
let pc = null;
let dc = null;
let cryptoKey = null;
let sidebarVisible = true;

// File chunking
const CHUNK_SIZE = 16 * 1024; // 16KB
let incomingFiles = {};     // { id: { name, type, total, chunks: [] } }
let outgoingFiles = {};

// ─────────────────────────────────────────────
//  Crypto (AES-GCM)
// ─────────────────────────────────────────────
async function genKey() {
  cryptoKey = await crypto.subtle.generateKey(
    { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}

async function encrypt(str) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder().encode(str);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, cryptoKey, enc);
  // pack iv + ct as base64
  const buf = new Uint8Array(iv.byteLength + ct.byteLength);
  buf.set(iv, 0);
  buf.set(new Uint8Array(ct), 12);
  return btoa(String.fromCharCode(...buf));
}

async function decrypt(b64) {
  const buf = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const iv = buf.slice(0, 12);
  const ct = buf.slice(12);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, cryptoKey, ct);
  return new TextDecoder().decode(pt);
}

async function encryptBinary(arrayBuf) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, cryptoKey, arrayBuf);
  const out = new Uint8Array(12 + ct.byteLength);
  out.set(iv, 0);
  out.set(new Uint8Array(ct), 12);
  return out.buffer;
}

async function decryptBinary(arrayBuf) {
  const buf = new Uint8Array(arrayBuf);
  const iv = buf.slice(0, 12);
  const ct = buf.slice(12);
  return await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, cryptoKey, ct);
}

// ─────────────────────────────────────────────
//  ECDH key exchange helpers (embed in SDP)
// ─────────────────────────────────────────────
let ecdhKeyPair = null;
let ecdhPubB64 = null;

async function initECDH() {
  ecdhKeyPair = await crypto.subtle.generateKey(
    { name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey']
  );
  const rawPub = await crypto.subtle.exportKey('raw', ecdhKeyPair.publicKey);
  ecdhPubB64 = btoa(String.fromCharCode(...new Uint8Array(rawPub)));
}

async function deriveSharedKey(theirPubB64) {
  const raw = Uint8Array.from(atob(theirPubB64), c => c.charCodeAt(0));
  const theirPub = await crypto.subtle.importKey(
    'raw', raw, { name: 'ECDH', namedCurve: 'P-256' }, false, []
  );
  cryptoKey = await crypto.subtle.deriveKey(
    { name: 'ECDH', public: theirPub },
    ecdhKeyPair.privateKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

// ─────────────────────────────────────────────
//  WebRTC setup
// ─────────────────────────────────────────────
const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' }
];

function createPC() {
  pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

  pc.onconnectionstatechange = () => {
    updateStatus(pc.connectionState);
    if (pc.connectionState === 'connected') {
      document.getElementById('sendBtn').disabled = false;
      addSystem('🔒 P2P接続確立 — 暗号化チャット開始');
    } else if (['disconnected','failed','closed'].includes(pc.connectionState)) {
      document.getElementById('sendBtn').disabled = true;
    }
  };

  pc.ondatachannel = e => setupDC(e.channel);
}

function setupDC(channel) {
  dc = channel;
  dc.binaryType = 'arraybuffer';

  dc.onmessage = async e => {
    if (typeof e.data === 'string') {
      // JSON control message
      try {
        const msg = JSON.parse(e.data);
        await handleMessage(msg);
      } catch {
        // fallback plain text (shouldn't happen)
      }
    } else {
      // binary chunk
      await handleBinaryChunk(e.data);
    }
  };
}

async function handleMessage(msg) {
  if (msg.type === 'text') {
    const plain = await decrypt(msg.payload);
    addMessage(plain, 'them');
  } else if (msg.type === 'file-meta') {
    incomingFiles[msg.id] = {
      name: msg.name,
      mime: msg.mime,
      total: msg.total,
      received: 0,
      chunks: []
    };
  } else if (msg.type === 'file-done') {
    const f = incomingFiles[msg.id];
    if (!f) return;
    const blob = new Blob(f.chunks, { type: f.mime });
    const url = URL.createObjectURL(blob);
    addFileMessage(f.name, f.mime, url, 'them');
    delete incomingFiles[msg.id];
  }
}

async function handleBinaryChunk(buf) {
  // first 16 bytes = UUID (as utf8), then 12+ct
  // format: [8 byte fileId as Uint8][rest is encrypted chunk]
  const view = new DataView(buf);
  // read fileId: first 8 bytes as hex string
  let fileId = '';
  for (let i = 0; i < 8; i++) fileId += view.getUint8(i).toString(16).padStart(2,'0');
  
  const encChunk = buf.slice(8);
  const plain = await decryptBinary(encChunk);
  
  const f = incomingFiles[fileId];
  if (!f) return;
  f.chunks.push(plain);
  f.received += plain.byteLength;
}

// ─────────────────────────────────────────────
//  Offer / Answer
// ─────────────────────────────────────────────
async function startOffer() {
  await initECDH();
  createPC();

  dc = pc.createDataChannel('chat');
  dc.binaryType = 'arraybuffer';
  setupDC(dc);

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  // wait for ICE gathering
  await waitICE(pc);

  // embed ECDH pub in sdp comment line
  const sdpObj = {
    sdp: pc.localDescription.sdp,
    type: pc.localDescription.type,
    pub: ecdhPubB64
  };

  document.getElementById('offerSDP').value = JSON.stringify(sdpObj);
  document.getElementById('offerSection').style.display = 'flex';
  document.getElementById('btnOffer').disabled = true;
  document.getElementById('btnAnswer').disabled = true;
}

async function showAnswerUI() {
  await initECDH();
  document.getElementById('answerSection').style.display = 'flex';
  document.getElementById('btnOffer').disabled = true;
  document.getElementById('btnAnswer').disabled = true;
}

async function processOffer() {
  const raw = document.getElementById('offerInput').value.trim();
  if (!raw) return alert('Offer を貼り付けてください');
  
  let sdpObj;
  try { sdpObj = JSON.parse(raw); } catch { return alert('無効な Offer です'); }

  await deriveSharedKey(sdpObj.pub);

  createPC();

  await pc.setRemoteDescription({ type: sdpObj.type, sdp: sdpObj.sdp });
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  await waitICE(pc);

  const answerObj = {
    sdp: pc.localDescription.sdp,
    type: pc.localDescription.type,
    pub: ecdhPubB64
  };

  document.getElementById('answerSDP').value = JSON.stringify(answerObj);
  document.getElementById('answerOutputStep').style.display = 'block';
}

async function applyAnswer() {
  const raw = document.getElementById('answerInput').value.trim();
  if (!raw) return alert('Answer を貼り付けてください');
  
  let sdpObj;
  try { sdpObj = JSON.parse(raw); } catch { return alert('無効な Answer です'); }

  await deriveSharedKey(sdpObj.pub);
  await pc.setRemoteDescription({ type: sdpObj.type, sdp: sdpObj.sdp });
}

function waitICE(pc) {
  return new Promise(resolve => {
    if (pc.iceGatheringState === 'complete') return resolve();
    pc.onicegatheringstatechange = () => {
      if (pc.iceGatheringState === 'complete') resolve();
    };
    // timeout fallback
    setTimeout(resolve, 5000);
  });
}

// ─────────────────────────────────────────────
//  Messaging
// ─────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !dc || dc.readyState !== 'open') return;

  const encrypted = await encrypt(text);
  dc.send(JSON.stringify({ type: 'text', payload: encrypted }));
  addMessage(text, 'me');
  input.value = '';
  input.style.height = '40px';
}

// ─────────────────────────────────────────────
//  File sending
// ─────────────────────────────────────────────
async function sendFile(input) {
  const file = input.files[0];
  if (!file || !dc || dc.readyState !== 'open') return;
  input.value = '';

  // generate 8-byte ID
  const idBytes = crypto.getRandomValues(new Uint8Array(8));
  const fileId = Array.from(idBytes).map(b => b.toString(16).padStart(2,'0')).join('');

  const totalChunks = Math.ceil(file.size / CHUNK_SIZE);

  // send meta
  dc.send(JSON.stringify({
    type: 'file-meta',
    id: fileId,
    name: file.name,
    mime: file.type || 'application/octet-stream',
    total: totalChunks
  }));

  // read & send chunks
  const arrayBuf = await file.arrayBuffer();
  
  for (let i = 0; i < totalChunks; i++) {
    const chunk = arrayBuf.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
    const encChunk = await encryptBinary(chunk);

    // prepend 8-byte fileId
    const out = new Uint8Array(8 + encChunk.byteLength);
    out.set(idBytes, 0);
    out.set(new Uint8Array(encChunk), 8);

    // wait for buffer to drain
    while (dc.bufferedAmount > 1024 * 1024) {
      await new Promise(r => setTimeout(r, 50));
    }
    dc.send(out.buffer);
  }

  // done signal
  dc.send(JSON.stringify({ type: 'file-done', id: fileId }));

  // local preview
  const url = URL.createObjectURL(file);
  addFileMessage(file.name, file.type, url, 'me');
}

// ─────────────────────────────────────────────
//  UI helpers
// ─────────────────────────────────────────────
function addMessage(text, who) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${who}`;

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;

  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.textContent = new Date().toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit' });

  wrap.appendChild(bubble);
  wrap.appendChild(meta);
  document.getElementById('messages').appendChild(wrap);
  scrollBottom();
}

function addFileMessage(name, mime, url, who) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${who}`;

  const isImg = mime.startsWith('image/');

  if (isImg) {
    const img = document.createElement('img');
    img.className = 'msg-img';
    img.src = url;
    img.alt = name;
    img.onclick = () => openLightbox(url);
    wrap.appendChild(img);
  } else {
    const fileDiv = document.createElement('div');
    fileDiv.className = 'msg-file';

    const icon = document.createElement('span');
    icon.className = 'file-icon';
    icon.textContent = getFileIcon(mime);

    const info = document.createElement('div');
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.textContent = name;
    info.appendChild(a);

    fileDiv.appendChild(icon);
    fileDiv.appendChild(info);
    wrap.appendChild(fileDiv);
  }

  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.textContent = new Date().toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit' });
  wrap.appendChild(meta);

  document.getElementById('messages').appendChild(wrap);
  scrollBottom();
}

function addSystem(text) {
  const el = document.createElement('div');
  el.className = 'msg-system';
  el.textContent = text;
  document.getElementById('messages').appendChild(el);
  scrollBottom();
}

function scrollBottom() {
  const m = document.getElementById('messages');
  m.scrollTop = m.scrollHeight;
}

function updateStatus(state) {
  const pill = document.getElementById('statusPill');
  const txt = document.getElementById('statusText');
  txt.textContent = state;
  pill.className = `status-pill ${state === 'connected' ? 'connected' : ''}`;
}

function copyText(id) {
  const el = document.getElementById(id);
  navigator.clipboard.writeText(el.value).then(() => {
    const btn = el.nextElementSibling.nextElementSibling || el.nextElementSibling;
    // find copy button
    const btns = el.parentElement.querySelectorAll('.btn');
    btns.forEach(b => {
      if (b.textContent.includes('コピー')) {
        const orig = b.textContent;
        b.textContent = '✅ コピー済み';
        setTimeout(() => b.textContent = orig, 2000);
      }
    });
  });
}

function toggleSidebar() {
  sidebarVisible = !sidebarVisible;
  document.getElementById('sidebar').classList.toggle('hidden', !sidebarVisible);
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = '40px';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function getFileIcon(mime) {
  if (mime.startsWith('video/')) return '🎬';
  if (mime.startsWith('audio/')) return '🎵';
  if (mime.includes('pdf')) return '📄';
  if (mime.includes('zip') || mime.includes('rar')) return '🗜️';
  return '📁';
}

function openLightbox(url) {
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}
</script>
